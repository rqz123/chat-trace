[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chattrace"
version = "0.1.0"
description = "聊迹：本地、只读的微信文字聊天归档与查询工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "cryptography>=41,<51",
  "psutil>=5.9,<8",
  "pywin32>=305; sys_platform == 'win32'",
  "openai>=1.68.0,<3",
]

[project.optional-dependencies]
wechat = ["wechatauto-replica==1.2.4.4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
chattrace = "chattrace.app:run"

[tool.setuptools.packages.find]
include = ["chattrace*"]

[tool.setuptools.package-data]
chattrace = ["static/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

